name: ci

# PR とマージキューの検査。ruleset の必須チェックには末尾の CI Gate だけを登録する想定
# （leaf を条件で skip しても gate が success / skipped を合格として集計する）。
# Renovate の automerge はこの結果を待つ。どのジョブも PR の情報（変更ファイルなど）を使わないので、
# merge_group でも同じ内容で走る。
on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]

permissions: {}

concurrency:
  # merge_group の ref はキューのエントリごとの gh-readonly-queue/... なので、エントリ同士は取り消し合わない。
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-workflows:
    name: lint workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # checkout に必要
    env:
      AQUA_CONFIG: .github/aqua-ci/aqua.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aquaproj/aqua-installer@611554c6f0137ba41c8dd15aca8bee82504ea461 # v4.1.1
        with:
          aqua_version: v2.66.1

      # upstream の actionlint は使わない。build.yml の concurrency.queue と `uses: $/...` を解釈できずに落ちる
      # （2026-11-21、actionlint 1.7.12 で build.yml を検査して再現）。
      - name: jactionlint
        run: jactionlint --profile correctness --format github

      # online audit（impostor-commit など）が GitHub API を引く。
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --persona pedantic --format github .

  test-scripts:
    name: test scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # checkout に必要
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - run: npm test

      # Renovate の更新 PR がマージ前にここで止まるよう、build.yml の plan と同じ検査をかける。
      - name: Validate versions.json and the FrankenPHP pin
        env:
          EVENT_NAME: workflow_dispatch
        run: |
          node scripts/plan.mjs
          node scripts/verify-frankenphp-pin.mjs

  # 上流の Dockerfile と bake の定義が、versions.json の baseImages に無い親イメージを参照していないかを
  # build.yml と同じ手順で確かめる。FrankenPHP の更新で上流が GO_VERSION を上げた場合などを、マージ前に止める。
  # あわせて php を amd64 で push せずにビルドする（BuildKit・setup-buildx・checkout・setup-node の更新と、
  # Dockerfile の取得と差し替えを、公開権限を持つ main の run より前に通す）。login・artifact・attest・
  # create-github-app-token など main の run でしか動かない action はここでは通らないので、Renovate で手動マージにしている。
  # 必須チェックと食い違わないよう paths では絞らない。
  check-base-images:
    name: check base images and smoke build php
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read # checkout に必要
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Read FrankenPHP pin
        id: fp
        run: |
          set -euo pipefail
          commit="$(jq -er .frankenphp.commit versions.json)"
          if ! [[ "${commit}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::versions.json の frankenphp.commit が不正: '${commit}'"
            exit 1
          fi
          echo "commit=${commit}" >> "${GITHUB_OUTPUT}"

      - name: Checkout php/frankenphp
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: php/frankenphp
          ref: ${{ steps.fp.outputs.commit }}
          path: frankenphp
          persist-credentials: false

      # build.yml と同じ BuildKit で組む（BuildKit の更新もここで通す）。
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe

      - name: Check php and FrankenPHP, smoke build php
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/docker-library/official-images/contents/library/php \
            -H 'Accept: application/vnd.github.raw+json' > "${RUNNER_TEMP}/library-php"
          out="${RUNNER_TEMP}/out"
          # コマンド置換の中の jq の失敗は for では拾えないので、先に変数へ取って検査する。
          minors="$(jq -er '.php | keys[]' versions.json)"
          for minor in ${minors}; do
            : > "${out}"
            GITHUB_OUTPUT="${out}" MINOR="${minor}" node scripts/php-pin.mjs
            php_version="$(sed -n 's/^phpVersion=//p' "${out}")"
            tag="$(sed -n 's/^officialTag=//p' "${out}")"
            moving="$(sed -n 's/^movingTag=//p' "${out}")"
            os="$(sed -n 's/^os=//p' "${out}")"
            echo "::group::php ${minor}（${tag}）"
            : > "${out}"
            GITHUB_OUTPUT="${out}" LIBRARY_FILE="${RUNNER_TEMP}/library-php" OFFICIAL_TAG="${tag}" MOVING_TAG="${moving}" \
              node scripts/resolve-official.mjs
            commit="$(sed -n 's/^gitCommit=//p' "${out}")"
            directory="$(sed -n 's/^directory=//p' "${out}")"
            GIT_COMMIT="${commit}" node scripts/verify-upstream-commit.mjs
            src="${RUNNER_TEMP}/php-${minor}"
            git init -q "${src}"
            git -C "${src}" fetch -q --depth 1 https://github.com/docker-library/php.git "${commit}"
            git -C "${src}" checkout -q FETCH_HEAD -- "${directory}"
            # build.yml と同じく、Dockerfile の版を pin に合わせる（夜のジョブの PR のように公式イメージがまだ無い版もここで通す）。
            GITHUB_OUTPUT=/dev/null DOCKERFILE="${src}/${directory}/Dockerfile" PHP_VERSION="${php_version}" node scripts/rewrite-php-dockerfile.mjs
            : > "${out}"
            GITHUB_OUTPUT="${out}" KIND=php DOCKERFILE="${src}/${directory}/Dockerfile" node scripts/pin-base-images.mjs
            pin_json="$(sed -n 's/^args=//p' "${out}")"
            pin_count="$(sed -n 's/^count=//p' "${out}")"
            if ! [[ "${pin_count}" =~ ^[0-9]+$ ]]; then
              echo "::error::pin の数が数値ではない: '${pin_count}'"
              exit 1
            fi
            mapfile -t pin_args < <(jq -r '.[]' <<< "${pin_json}")
            if [ "${#pin_args[@]}" -ne "${pin_count}" ]; then
              echo "::error::親イメージの pin の引数が ${#pin_args[@]} 個で、${pin_count} 個ではない"
              exit 1
            fi
            echo "::endgroup::"
            echo "::group::smoke build php ${php_version}（linux/amd64、push しない）"
            docker buildx build "${src}/${directory}" "${pin_args[@]}" --platform linux/amd64 --pull --provenance=false \
              --output type=cacheonly
            echo "::endgroup::"
            echo "::group::frankenphp ${minor}"
            target="runner-php-${minor//./-}-${os}"
            (cd frankenphp && PHP_VERSION="${minor}" SHA='' docker buildx bake --print "${target}") > "${RUNNER_TEMP}/bake.json"
            (cd frankenphp && GITHUB_OUTPUT=/dev/null KIND=frankenphp BAKE_FILE="${RUNNER_TEMP}/bake.json" TARGET="${target}" \
              EXPECTED_PHP_BASE="docker-image://php:${moving}" VERSIONS_FILE="${GITHUB_WORKSPACE}/versions.json" \
              node ../scripts/pin-base-images.mjs)
            echo "::endgroup::"
          done

  renovate-config:
    name: renovate-config-validator
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    container:
      image: ghcr.io/renovatebot/renovate:44.220.0@sha256:71599a2007228ada2cc6acb5ed836cf2c088537ffe76dafee1ee6a1c5c45d5e5
      # 既定の非 root ユーザーだと actions/checkout が runner 所有のファイルに書けない。
      # 経緯は animalife/github-actions の lint-renovate-config.yml を参照。
      options: --user root
    permissions:
      contents: read # checkout に必要
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: renovate-config-validator --strict

  verify-actions-lock:
    name: verify actions.lock
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # checkout に必要
    env:
      # renovate.json5 の constraints.ghActionsLock と揃える（Renovate が lockfile を書く版）。
      # renovate: datasource=github-releases depName=github/gh-actions-lock
      GH_ACTIONS_LOCK_VERSION: v0.4.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # タグ pin で中身が固定されるのは immutable release だけなので、入れる前に確かめる。
      - name: Install gh-actions-lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          immutable="$(gh release view "${GH_ACTIONS_LOCK_VERSION}" -R github/gh-actions-lock --json isImmutable --jq .isImmutable)"
          if [ "${immutable}" != "true" ]; then
            echo "::error::gh-actions-lock ${GH_ACTIONS_LOCK_VERSION} は immutable release ではありません"
            exit 1
          fi
          gh extension install github/gh-actions-lock --pin "${GH_ACTIONS_LOCK_VERSION}"

      # lockfile の再生成は `gh actions-lock --no-narrow` で行う（Renovate と同じフラグ）。
      # uses: の SHA の固定は、Actions の設定 sha_pinning_required とこの verify で守られる。
      - name: Verify actions.lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh actions-lock --verify

  gate:
    name: CI Gate
    needs: [lint-workflows, test-scripts, check-base-images, renovate-config, verify-actions-lock]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Aggregate results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Results: ${RESULTS}"
          if [ -z "${RESULTS// /}" ]; then
            echo "::error::集計する結果が無い"
            exit 1
          fi
          for r in ${RESULTS}; do
            case "${r}" in
              success|skipped) ;;
              *) echo "::error::必須のジョブが ${r} で終わった"; exit 1 ;;
            esac
          done
