name: build

# 経路の説明は README を参照。
#
# schedule は置かない（public リポジトリは 60 日 activity が無いと schedule が自動で無効になるため）。
# php → FrankenPHP は同じ run の中で needs でつなぐ。GITHUB_TOKEN による push のイベントでは
# 別のワークフローが起動しないので、ワークフローを分けた連鎖にはしない。
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      php-version:
        description: '公開を待つ PHP の版（例 8.6.1）。公開されたら versions.json を上げる PR を作る（この run では公開しない）。空なら全版をビルドし直す'
        required: false
        type: string
        default: ''
      redispatch-count:
        description: '夜の PR が conflict したために dispatch し直された回数（自動で付く。手で dispatch するときは 0 のまま）'
        required: false
        type: string
        default: '0'

permissions: {}

concurrency:
  # 夜のジョブは版ごとに分け、普段のビルドを止めない（php.net を待つのが最大 5 時間 45 分、PR の見届けが最大 4 時間で、
  # 同じ版の run がグループを占有するのは最大約 10 時間）。夜のジョブは公開しないので、
  # 公開するのは build グループの run だけで、これは commit 順に直列で走る。
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.php-version != '' && format('wait-{0}', inputs.php-version) || 'build' }}
  cancel-in-progress: false
  # 既定（queue: single）では 3 本目の push で 2 本目の pending が黙って置き換わる。
  queue: max

env:
  PHP_IMAGE: ghcr.io/${{ github.repository }}/php
  FRANKENPHP_IMAGE: ghcr.io/${{ github.repository }}/frankenphp

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # checkout に必要
      actions: read # 最後に成功した push run を探すのに必要
    outputs:
      phpVersions: ${{ steps.plan.outputs.phpVersions }}
      phpBuilds: ${{ steps.plan.outputs.phpBuilds }}
      phpPublishes: ${{ steps.plan.outputs.phpPublishes }}
      frankenphpBuilds: ${{ steps.plan.outputs.frankenphpBuilds }}
      frankenphpPublishes: ${{ steps.plan.outputs.frankenphpPublishes }}
      frankenphpVersion: ${{ steps.plan.outputs.frankenphpVersion }}
      frankenphpCommit: ${{ steps.plan.outputs.frankenphpCommit }}
      platformCount: ${{ steps.plan.outputs.platformCount }}
      waitFor: ${{ steps.plan.outputs.waitFor }}
      redispatchCount: ${{ steps.plan.outputs.redispatchCount }}
    steps:
      # dispatch した ref の workflow ファイルが実行されるので、ブランチ上で外せば素通りできる
      # （強制力のある境界ではなく誤操作のガード）。skip ではなく失敗にして誤 ref に気付けるようにする。
      - name: Reject non-main dispatch
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::workflow_dispatch は main からのみ実行できます（選択された ref: ${GITHUB_REF}）"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # push の差分を最後に成功した push run と比べるため、履歴を全部取る。
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      # push の差分の基準は event.before ではなく、最後に成功した push run の head_sha にする。
      # event.before だと、失敗した run の変更が後続の push で拾われず、自然には直らない。dispatch の run は混ぜない。
      - name: Find the last successful push run
        id: base
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/runs?branch=main&event=push&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // ""')"
          echo "最後に成功した push run: ${sha:-（無い。全部ビルドする）}"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"

      - name: Plan
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          PHP_VERSION_INPUT: ${{ inputs.php-version }}
          REDISPATCH_COUNT_INPUT: ${{ inputs.redispatch-count }}
          BEFORE_SHA: ${{ steps.base.outputs.sha }}
        run: node scripts/plan.mjs

      # 夜のジョブ（版を指定した dispatch）はビルドしないので確かめない。
      - name: Verify FrankenPHP tag points at the pinned commit
        if: ${{ steps.plan.outputs.waitFor == '' }}
        run: node scripts/verify-frankenphp-pin.mjs

  # 夜のジョブ: php.net で版が公開されるのを待つ。この run では公開しない。
  wait:
    name: Wait for php.net release
    needs: plan
    if: ${{ needs.plan.outputs.waitFor != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read # checkout に必要
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      # 期限は job の timeout-minutes より手前に置き、未公開なら自分で失敗させて理由を残す。
      - name: Wait
        env:
          PHP_VERSION: ${{ needs.plan.outputs.waitFor }}
          INTERVAL_SECONDS: '180'
          DEADLINE_SECONDS: '20700'
        run: node scripts/wait-php-release.mjs

  # 公開されたら、最新の main から versions.json のパッチ版を上げる PR を作り、auto-merge（マージキュー）に入れる。
  # その後は普段の CI → マージ → push の run で公開される。
  # GITHUB_TOKEN で作った PR では CI が起きないので、この repo だけに入れた App のトークンを使う。
  # App のトークンを持つこのジョブでは、上流のコードやダウンロードしたものを実行しない（自分のスクリプトだけ）。
  bump:
    name: Open a version bump PR
    needs: [plan, wait]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # 秘密鍵は environment の secret に置き、デプロイブランチを main に限る。
    environment: version-bump
    permissions:
      contents: read # checkout に必要
    outputs:
      pr: ${{ steps.bump.outputs.pr }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      # 変数が空だと create-github-app-token の失敗の理由が分かりにくいので、先に止める。
      - name: Check the App client ID
        env:
          CLIENT_ID: ${{ vars.VERSION_BUMP_APP_CLIENT_ID }}
        run: |
          if [ -z "${CLIENT_ID}" ]; then
            echo "::error::repository variable VERSION_BUMP_APP_CLIENT_ID が空"
            exit 1
          fi

      - name: Get GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          # App を作り直しても、ワークフローを変えずに差し替えられるよう variable で受ける（Client ID は秘密ではない）。
          client-id: ${{ vars.VERSION_BUMP_APP_CLIENT_ID }}
          private-key: ${{ secrets.VERSION_BUMP_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open the PR
        id: bump
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PHP_VERSION: ${{ needs.plan.outputs.waitFor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/bump-php-version.mjs

  # 夜の PR がマージされるまで見届ける。PR の CI の失敗、キューから外れた、conflict、閉じられた、期限（4 時間）切れなら
  # この run を失敗にする。App が作った PR の失敗は App にしか通知されないので、run の失敗と Issue（failure-issue）に変えるため。
  # 読むだけなので App のトークンは渡さず GITHUB_TOKEN を使う。
  watch-bump:
    name: Watch the version bump PR
    needs: [plan, bump]
    if: ${{ needs.bump.outputs.pr != '' }}
    runs-on: ubuntu-24.04
    # 見届けの期限（DEADLINE_SECONDS の 4 時間）より手前で job が切られないように。
    timeout-minutes: 250
    outputs:
      redispatch: ${{ steps.watch.outputs.redispatch }}
    permissions:
      contents: write # 先を越された夜の PR の枝を消すのに必要（checkout にも使う）
      pull-requests: write # PR の状態を読む・残った PR を閉じるのに必要
      checks: read # statusCheckRollup のチェックを読むのに必要
      statuses: read # statusCheckRollup のステータスを読むのに必要
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Watch
        id: watch
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.bump.outputs.pr }}
          PHP_VERSION: ${{ needs.plan.outputs.waitFor }}
          REDISPATCH_COUNT: ${{ needs.plan.outputs.redispatchCount }}
          INTERVAL_SECONDS: '60'
          DEADLINE_SECONDS: '14400'
        run: node scripts/watch-bump-pr.mjs

  # 夜の PR が main と conflict した（同じ minor の digest 更新が先に入ったなど）ら、同じ版で build.yml を dispatch し直す。
  # 新しい run は php.net の確認がすぐ済み、bump が conflict した PR を閉じて最新の main から作り直す。回数の上限は
  # scripts/lib/publish.mjs の MAX_REDISPATCH。GITHUB_TOKEN の workflow_dispatch は新しい run を作れる。
  redispatch:
    name: Redispatch the night job
    needs: [plan, watch-bump]
    if: ${{ needs.watch-bump.outputs.redispatch == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write # workflow_dispatch に必要
    steps:
      - name: Dispatch build.yml again
        env:
          GH_TOKEN: ${{ github.token }}
          PHP_VERSION: ${{ needs.plan.outputs.waitFor }}
          COUNT: ${{ needs.plan.outputs.redispatchCount }}
        run: |
          set -euo pipefail
          next=$((COUNT + 1))
          gh workflow run build.yml --repo "${GITHUB_REPOSITORY}" --ref main -f php-version="${PHP_VERSION}" -f redispatch-count="${next}"
          {
            echo "### 夜のジョブを起動し直した"
            echo ""
            echo "PHP ${PHP_VERSION} の PR が main と conflict したので、最新の main から PR を作り直す run を起動した（${next} 回目）。"
            echo "結果は Actions の一覧にある新しい run で確かめる。"
          } >> "${GITHUB_STEP_SUMMARY}"

  # 両アーキを同じ Dockerfile でビルドするため、取得と差し替えは版ごとに 1 回だけ行い、コンテキストを配る。
  php-prepare:
    name: Prepare php ${{ matrix.version }}
    needs: plan
    if: ${{ needs.plan.outputs.phpVersions != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # checkout に必要
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.phpPublishes) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      # raw.githubusercontent.com は使わない。cache-control: max-age=300 で最大 5 分古い内容が返る
      # （2026-11-21、curl -sI https://raw.githubusercontent.com/docker-library/official-images/HEAD/library/php で確認）。
      - name: Fetch library/php
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/docker-library/official-images/contents/library/php \
            -H 'Accept: application/vnd.github.raw+json' > "${RUNNER_TEMP}/library-php"

      - name: Resolve upstream directory
        id: resolve
        env:
          LIBRARY_FILE: ${{ runner.temp }}/library-php
          OFFICIAL_TAG: ${{ matrix.officialTag }}
          MOVING_TAG: ${{ matrix.movingTag }}
        run: node scripts/resolve-official.mjs

      - name: Verify the upstream commit is on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_COMMIT: ${{ steps.resolve.outputs.gitCommit }}
        run: node scripts/verify-upstream-commit.mjs

      - name: Checkout docker-library/php
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: docker-library/php
          ref: ${{ steps.resolve.outputs.gitCommit }}
          path: upstream
          sparse-checkout: ${{ steps.resolve.outputs.directory }}
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # Dockerfile の版を versions.json の pin に合わせる（違えば php.net の情報で PHP_VERSION / URL / SHA256 だけ差し替える）。
      # 合わせた後の PHP_VERSION が pin と一致しなければ止まる。
      - name: Set PHP version to the pin
        id: rewrite
        env:
          DOCKERFILE: upstream/${{ steps.resolve.outputs.directory }}/Dockerfile
          PHP_VERSION: ${{ matrix.phpVersion }}
        run: node scripts/rewrite-php-dockerfile.mjs

      - name: Pin base images
        id: pin
        env:
          KIND: php
          DOCKERFILE: upstream/${{ steps.resolve.outputs.directory }}/Dockerfile
        run: node scripts/pin-base-images.mjs

      # ディレクトリをそのまま upload しない。upload-artifact はファイルモードを保たず、docker-php-* の実行ビットが落ちる
      # （actions/upload-artifact の README の Permission Loss 節）。
      - name: Pack build context
        env:
          DIRECTORY: upstream/${{ steps.resolve.outputs.directory }}
          VERSION: ${{ matrix.version }}
          GIT_COMMIT: ${{ steps.resolve.outputs.gitCommit }}
          UPSTREAM_DIRECTORY: ${{ steps.resolve.outputs.directory }}
          PHP_VERSION: ${{ steps.rewrite.outputs.phpVersion }}
          OVERRIDDEN: ${{ steps.rewrite.outputs.overridden }}
          PIN_ARGS: ${{ steps.pin.outputs.args }}
          PIN_COUNT: ${{ steps.pin.outputs.count }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/php-context"
          mkdir -p "${out}"
          tar -C "${DIRECTORY}" -cf "${out}/context.tar" .
          jq -n --arg phpVersion "${PHP_VERSION}" --arg gitCommit "${GIT_COMMIT}" \
            --arg directory "${UPSTREAM_DIRECTORY}" --arg overridden "${OVERRIDDEN}" \
            --argjson pinArgs "${PIN_ARGS}" --argjson pinCount "${PIN_COUNT}" \
            '{$phpVersion, $gitCommit, $directory, $overridden, $pinArgs, $pinCount}' > "${out}/meta.json"
          cat "${out}/meta.json"
          {
            echo "### php ${VERSION}"
            echo ""
            echo "- 上流: docker-library/php@${GIT_COMMIT} ${UPSTREAM_DIRECTORY}"
            echo "- PHP: ${PHP_VERSION}（php.net の版への差し替え: ${OVERRIDDEN}）"
          } >> "${GITHUB_STEP_SUMMARY}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: php-context-${{ matrix.version }}
          path: ${{ runner.temp }}/php-context/
          if-no-files-found: error
          retention-days: 7

  php-build:
    name: Build php ${{ matrix.slug }}
    needs: [plan, php-prepare]
    if: ${{ !cancelled() && needs.php-prepare.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # 誤操作のガード: main に限るデプロイブランチの制限で、ブランチから dispatch した run の公開を止める。
    # 書き込み権限者がブランチ上でこの行を外せば素通りできるので、境界ではない（境界は消費側の attestation の検証）。
    environment: ghcr-publish
    permissions:
      packages: write # push-by-digest に必要
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.phpBuilds) }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: php-context-${{ matrix.version }}
          path: ${{ runner.temp }}/php-context

      # 既定の moby/buildkit:buildx-stable-1 はタグ参照で、push-by-digest では GHCR の認証情報を受け取る。digest で固定する。
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # タグを付けずに digest だけで push する。タグは検査を通った後に publish が付ける。
      - name: Build and push by digest
        env:
          PLATFORM: ${{ matrix.platform }}
          SLUG: ${{ matrix.slug }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          ctx="${RUNNER_TEMP}/php-context"
          mkdir -p "${ctx}/src"
          tar -C "${ctx}/src" -xf "${ctx}/context.tar"
          meta="${ctx}/meta.json"
          # jq が失敗しても mapfile は空の配列で続くので、pin-base-images が出した数と突き合わせる
          # （pin が黙って外れないように。上流が親をすべて digest で書けば、正当に 0 個になる）。
          expected="$(jq -er .pinCount "${meta}")"
          if ! [[ "${expected}" =~ ^[0-9]+$ ]]; then
            echo "::error::pin の数が数値ではない: '${expected}'"
            exit 1
          fi
          mapfile -t pin_args < <(jq -r '.pinArgs[]' "${meta}")
          if [ "${#pin_args[@]}" -ne "${expected}" ]; then
            echo "::error::親イメージの pin の引数が ${#pin_args[@]} 個で、${expected} 個ではない"
            exit 1
          fi
          docker buildx build "${ctx}/src" \
            "${pin_args[@]}" \
            --platform "${PLATFORM}" \
            --pull \
            --provenance=false \
            --label "org.opencontainers.image.source=${SOURCE}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=$(jq -r .phpVersion "${meta}")" \
            --label "dev.animalife.php-images.upstream=https://github.com/docker-library/php/tree/$(jq -r .gitCommit "${meta}")/$(jq -r .directory "${meta}")" \
            --label "dev.animalife.php-images.upstream-commit=$(jq -r .gitCommit "${meta}")" \
            --label "dev.animalife.php-images.php-overridden=$(jq -r .overridden "${meta}")" \
            --output "type=image,name=${PHP_IMAGE},push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=true" \
            --metadata-file "${RUNNER_TEMP}/metadata.json"
          digest="$(jq -r '."containerimage.digest"' "${RUNNER_TEMP}/metadata.json")"
          if ! [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::digest を読めない: '${digest}'"
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/digest"
          echo "${digest}" > "${RUNNER_TEMP}/digest/${SLUG}"

      # publish が読むのは php-verified-* だけ。ここで verified の名前を使うと、検査前の digest にタグが付く。
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: php-unverified-${{ matrix.slug }}
          path: ${{ runner.temp }}/digest/
          if-no-files-found: error
          retention-days: 7

  # 外部製の container-structure-test に packages: write のトークンを渡さないよう、ビルドとは別ジョブにする。
  php-test:
    name: Test php ${{ matrix.slug }}
    needs: [plan, php-build]
    if: ${{ !cancelled() && needs.php-build.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read # checkout に必要
      packages: read # push-by-digest したイメージの pull に必要
    env:
      AQUA_CONFIG: .github/aqua.yaml
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.phpBuilds) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: php-unverified-${{ matrix.slug }}
          path: ${{ runner.temp }}/digest

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: php-context-${{ matrix.version }}
          path: ${{ runner.temp }}/php-context

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: aquaproj/aqua-installer@611554c6f0137ba41c8dd15aca8bee82504ea461 # v4.1.1
        with:
          aqua_version: v2.66.1

      # ランナーはビルドしたアーキと同じなので、CST の --platform は既定（ホスト）でよい。
      - name: Test
        env:
          SLUG: ${{ matrix.slug }}
        run: |
          set -euo pipefail
          digest="$(cat "${RUNNER_TEMP}/digest/${SLUG}")"
          ref="${PHP_IMAGE}@${digest}"
          docker pull "${ref}"
          container-structure-test test --image "${ref}" --config tests/php/container-structure-test.yaml
          expected="$(jq -r .phpVersion "${RUNNER_TEMP}/php-context/meta.json")"
          actual="$(docker run --rm "${ref}" php -r 'echo PHP_VERSION;')"
          if [ "${actual}" != "${expected}" ]; then
            echo "::error::php の版が ${actual} で、期待した ${expected} と違う"
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: php-verified-${{ matrix.slug }}
          path: ${{ runner.temp }}/digest/
          if-no-files-found: error
          retention-days: 7

  php-publish:
    name: Publish php ${{ matrix.version }}
    needs: [plan, php-test]
    # どれか 1 つのアーキの検査が落ちたら、その run のタグ付けは全部止める。
    if: ${{ !cancelled() && needs.php-test.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # 誤操作のガード: main に限るデプロイブランチの制限で、ブランチから dispatch した run の公開を止める。
    # 書き込み権限者がブランチ上でこの行を外せば素通りできるので、境界ではない（境界は消費側の attestation の検証）。
    environment: ghcr-publish
    permissions:
      contents: read # checkout に必要
      packages: write # index とタグの push、attestation の push に必要
      id-token: write # attestation の署名に必要
      attestations: write # attestation の保存に必要
      artifact-metadata: write # attestation のストレージレコード作成に必要
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.phpPublishes) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      # 数は publish-image が検査する。pattern 指定の download-artifact は一致が 0 件でも失敗しない
      # （2026-11-21、actions/download-artifact@9000827 の src で件数を検査していないことを確認）。
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: php-verified-${{ matrix.version }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        id: publish
        uses: $/.github/actions/publish-image
        with:
          image: ${{ env.PHP_IMAGE }}
          digests-dir: ${{ runner.temp }}/digests
          expected-count: ${{ needs.plan.outputs.platformCount }}
          staging-tag: staging-${{ matrix.version }}
          kind: php
          minor: ${{ matrix.version }}

      # FrankenPHP のビルドが php-base を決めるのに使う（scripts/lib/publish.mjs の planFrankenphp）。
      - name: Save publish record
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          DECISION: ${{ steps.publish.outputs.decision }}
          PHP_VERSION: ${{ steps.publish.outputs.php-version }}
          VERSION: ${{ matrix.version }}
        run: |
          mkdir -p "${RUNNER_TEMP}/php-digest"
          jq -n --arg decision "${DECISION}" --arg digest "${DIGEST}" --arg phpVersion "${PHP_VERSION}" \
            '{$decision, $digest, $phpVersion}' > "${RUNNER_TEMP}/php-digest/${VERSION}.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: php-digest-${{ matrix.version }}
          path: ${{ runner.temp }}/php-digest/
          if-no-files-found: error
          retention-days: 7

  # FrankenPHP をどの php の上に組むかを、版ごとに 1 回だけ決めて両アーキへ配る（移動タグをアーキごとに読むと、
  # その間に移動タグが動いたとき、アーキで違う php の上に組まれる）。php を skip した版は FrankenPHP も組まない。
  frankenphp-plan:
    name: Plan frankenphp
    needs: [plan, php-publish]
    # php のジョブが skipped（FrankenPHP の pin だけの更新）でも走らせる。
    # needs だけだと依存先が skipped のとき後続も skipped になる。
    if: ${{ !failure() && !cancelled() && needs.plan.outputs.frankenphpBuilds != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # checkout に必要
      packages: read # php イメージの移動タグを読むのに必要
    outputs:
      builds: ${{ steps.plan.outputs.builds }}
      publishes: ${{ steps.plan.outputs.publishes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: php-digest-*
          path: ${{ runner.temp }}/php-digest
          merge-multiple: true

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide php base
        id: plan
        env:
          FP_PUBLISHES: ${{ needs.plan.outputs.frankenphpPublishes }}
          FP_BUILDS: ${{ needs.plan.outputs.frankenphpBuilds }}
          PHP_VERSIONS: ${{ needs.plan.outputs.phpVersions }}
          RECORD_DIR: ${{ runner.temp }}/php-digest
          OUT_DIR: ${{ runner.temp }}/php-base
        run: node scripts/frankenphp-plan.mjs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ steps.plan.outputs.builds != '[]' }}
        with:
          name: php-base
          path: ${{ runner.temp }}/php-base/
          if-no-files-found: error
          retention-days: 7

  frankenphp-build:
    name: Build frankenphp ${{ matrix.slug }}
    needs: [plan, frankenphp-plan]
    if: ${{ !cancelled() && needs.frankenphp-plan.result == 'success' && needs.frankenphp-plan.outputs.builds != '[]' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # 上流の Dockerfile は GITHUB_TOKEN を secret としてマウントした RUN で、版を固定しない第三者のソース
    # （e-dant/watcher の最新リリース）をビルドする。そこに packages: write のトークンを渡さないよう、
    # このジョブは OCI アーカイブを作るだけにして、push は frankenphp-push に分ける。
    permissions:
      contents: read # checkout に必要
      packages: read # php イメージの pull に必要
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.frankenphp-plan.outputs.builds) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Checkout php/frankenphp
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: php/frankenphp
          ref: ${{ needs.plan.outputs.frankenphpCommit }}
          path: frankenphp
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: php-base
          path: ${{ runner.temp }}/php-base

      # 既定の moby/buildkit:buildx-stable-1 はタグ参照で、push-by-digest では GHCR の認証情報を受け取る。digest で固定する。
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read php base
        id: php
        env:
          MINOR: ${{ matrix.version }}
        run: |
          set -euo pipefail
          f="${RUNNER_TEMP}/php-base/${MINOR}.json"
          digest="$(jq -r .digest "${f}")"
          if ! [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::php-base の digest が不正: '${digest}'"
            exit 1
          fi
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Pin base images
        id: bake
        env:
          MINOR: ${{ matrix.version }}
          OS: ${{ matrix.os }}
          MOVING_TAG: ${{ matrix.movingTag }}
          KIND: frankenphp
          BAKE_FILE: ${{ runner.temp }}/bake.json
        run: |
          set -euo pipefail
          target="runner-php-${MINOR//./-}-${OS}"
          (cd frankenphp && PHP_VERSION="${MINOR}" SHA='' docker buildx bake --print "${target}") > "${BAKE_FILE}"
          (cd frankenphp && TARGET="${target}" EXPECTED_PHP_BASE="docker-image://php:${MOVING_TAG}" \
            VERSIONS_FILE="${GITHUB_WORKSPACE}/versions.json" node ../scripts/pin-base-images.mjs)
          echo "target=${target}" >> "${GITHUB_OUTPUT}"

      - name: Build OCI archive
        env:
          TARGET: ${{ steps.bake.outputs.target }}
          PLATFORM: ${{ matrix.platform }}
          SLUG: ${{ matrix.slug }}
          PHP_DIGEST: ${{ steps.php.outputs.digest }}
          PHP_VERSION: ${{ matrix.version }}
          VERSION: ${{ needs.plan.outputs.frankenphpVersion }}
          SHA: ${{ needs.plan.outputs.frankenphpCommit }}
          LATEST: 'false'
          # 上流 docker-bake.hcl の secret に渡る。
          GITHUB_TOKEN: ${{ github.token }}
          PIN_ARGS: ${{ steps.bake.outputs.args }}
          PIN_COUNT: ${{ steps.bake.outputs.count }}
          PHP_MINOR: ${{ matrix.version }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        working-directory: frankenphp
        run: |
          set -euo pipefail
          # 空や数字でない値は [ -ne ] が終了コード 2 で偽になり素通りするので、先に数値かを確かめる。
          if ! [[ "${PIN_COUNT}" =~ ^[0-9]+$ ]]; then
            echo "::error::pin の数が数値ではない: '${PIN_COUNT}'"
            exit 1
          fi
          mapfile -t pin_args < <(jq -r '.[]' <<< "${PIN_ARGS}")
          if [ "${#pin_args[@]}" -ne "${PIN_COUNT}" ]; then
            echo "::error::親イメージの pin の引数が ${#pin_args[@]} 個で、${PIN_COUNT} 個ではない"
            exit 1
          fi
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          CREATED="$(TZ=UTC git log -1 --date=format-local:%Y-%m-%dT%H:%M:%SZ --format=%cd)"
          export SOURCE_DATE_EPOCH CREATED
          docker buildx bake "${TARGET}" \
            --pull \
            --set "${TARGET}.contexts.php-base=docker-image://${PHP_IMAGE}@${PHP_DIGEST}" \
            "${pin_args[@]}" \
            --set "${TARGET}.platform=${PLATFORM}" \
            --set "${TARGET}.tags=" \
            --set "${TARGET}.attest=type=provenance,disabled=true" \
            --set "${TARGET}.labels.org.opencontainers.image.source=${SOURCE}" \
            --set "${TARGET}.labels.org.opencontainers.image.revision=${GITHUB_SHA}" \
            --set "${TARGET}.labels.dev.animalife.php-images.frankenphp.revision=${SHA}" \
            --set "${TARGET}.labels.dev.animalife.php-images.php-base=${PHP_IMAGE}@${PHP_DIGEST}" \
            --set "${TARGET}.output=type=oci,dest=${RUNNER_TEMP}/oci/image.tar,oci-mediatypes=true,rewrite-timestamp=true" \
            --metadata-file "${RUNNER_TEMP}/metadata.json"
          digest="$(jq -r --arg t "${TARGET}" '.[$t]."containerimage.digest"' "${RUNNER_TEMP}/metadata.json")"
          if ! [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::digest を読めない: '${digest}'"
            exit 1
          fi
          echo "${digest}" > "${RUNNER_TEMP}/oci/digest"
          cp "${RUNNER_TEMP}/php-base/${PHP_MINOR}.json" "${RUNNER_TEMP}/oci/php-base.json"
          {
            echo "### frankenphp ${SLUG}"
            echo ""
            echo "- FrankenPHP: ${VERSION}（${SHA}）"
            echo "- php-base: \`${PHP_IMAGE}@${PHP_DIGEST}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frankenphp-oci-${{ matrix.slug }}
          path: ${{ runner.temp }}/oci/
          if-no-files-found: error
          retention-days: 3

  frankenphp-push:
    name: Push frankenphp ${{ matrix.slug }}
    needs: [plan, frankenphp-plan, frankenphp-build]
    if: ${{ !cancelled() && needs.frankenphp-build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # 誤操作のガード: main に限るデプロイブランチの制限で、ブランチから dispatch した run の公開を止める。
    # 書き込み権限者がブランチ上でこの行を外せば素通りできるので、境界ではない（境界は消費側の attestation の検証）。
    environment: ghcr-publish
    permissions:
      packages: write # push-by-digest に必要
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.frankenphp-plan.outputs.builds) }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frankenphp-oci-${{ matrix.slug }}
          path: ${{ runner.temp }}/oci

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --preserve-digests: 送る途中で manifest が変わる（再圧縮など）なら、別の digest で push せずに失敗させる。
      - name: Push by digest
        env:
          SLUG: ${{ matrix.slug }}
        run: |
          set -euo pipefail
          digest="$(cat "${RUNNER_TEMP}/oci/digest")"
          if ! [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::digest が不正: '${digest}'"
            exit 1
          fi
          skopeo copy --preserve-digests --authfile "${HOME}/.docker/config.json" \
            "oci-archive:${RUNNER_TEMP}/oci/image.tar" "docker://${FRANKENPHP_IMAGE}@${digest}"
          mkdir -p "${RUNNER_TEMP}/digest"
          echo "${digest}" > "${RUNNER_TEMP}/digest/${SLUG}"
          cp "${RUNNER_TEMP}/oci/php-base.json" "${RUNNER_TEMP}/digest/${SLUG}.php-base.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frankenphp-unverified-${{ matrix.slug }}
          path: ${{ runner.temp }}/digest/
          if-no-files-found: error
          retention-days: 7

  frankenphp-test:
    name: Test frankenphp ${{ matrix.slug }}
    needs: [plan, frankenphp-plan, frankenphp-push]
    if: ${{ !cancelled() && needs.frankenphp-push.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read # checkout に必要
      packages: read # push-by-digest したイメージの pull に必要
    env:
      AQUA_CONFIG: .github/aqua.yaml
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.frankenphp-plan.outputs.builds) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frankenphp-unverified-${{ matrix.slug }}
          path: ${{ runner.temp }}/digest

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: aquaproj/aqua-installer@611554c6f0137ba41c8dd15aca8bee82504ea461 # v4.1.1
        with:
          aqua_version: v2.66.1

      - name: Test
        env:
          SLUG: ${{ matrix.slug }}
          FRANKENPHP_VERSION: ${{ needs.plan.outputs.frankenphpVersion }}
        run: |
          set -euo pipefail
          digest="$(cat "${RUNNER_TEMP}/digest/${SLUG}")"
          ref="${FRANKENPHP_IMAGE}@${digest}"
          docker pull "${ref}"
          container-structure-test test --image "${ref}" --config tests/frankenphp/container-structure-test.yaml
          # 期待する PHP の版は、ビルドで php-base に選んだ php イメージの版（イメージ自身からは作らない）。
          expected_php="$(jq -r .phpVersion "${RUNNER_TEMP}/digest/${SLUG}.php-base.json")"
          env_php="$(docker image inspect "${ref}" --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^PHP_VERSION=//p')"
          if [ "${env_php}" != "${expected_php}" ]; then
            echo "::error::イメージの PHP_VERSION が '${env_php}' で、php-base の ${expected_php} と違う"
            exit 1
          fi
          expected="FrankenPHP ${FRANKENPHP_VERSION} PHP ${expected_php} Caddy "
          actual="$(docker run --rm "${ref}" frankenphp version)"
          if [[ "${actual}" != "${expected}"* ]]; then
            echo "::error::frankenphp version が '${actual}' で、'${expected}' で始まらない"
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frankenphp-verified-${{ matrix.slug }}
          path: ${{ runner.temp }}/digest/${{ matrix.slug }}
          if-no-files-found: error
          retention-days: 7

  frankenphp-publish:
    name: Publish frankenphp ${{ matrix.version }}
    needs: [plan, frankenphp-plan, frankenphp-test]
    if: ${{ !cancelled() && needs.frankenphp-test.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # 誤操作のガード: main に限るデプロイブランチの制限で、ブランチから dispatch した run の公開を止める。
    # 書き込み権限者がブランチ上でこの行を外せば素通りできるので、境界ではない（境界は消費側の attestation の検証）。
    environment: ghcr-publish
    permissions:
      contents: read # checkout に必要
      packages: write # index とタグの push、attestation の push に必要
      id-token: write # attestation の署名に必要
      attestations: write # attestation の保存に必要
      artifact-metadata: write # attestation のストレージレコード作成に必要
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.frankenphp-plan.outputs.publishes) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: frankenphp-verified-${{ matrix.version }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        id: publish
        uses: $/.github/actions/publish-image
        with:
          image: ${{ env.FRANKENPHP_IMAGE }}
          digests-dir: ${{ runner.temp }}/digests
          expected-count: ${{ needs.plan.outputs.platformCount }}
          staging-tag: staging-php${{ matrix.version }}-${{ matrix.os }}
          kind: frankenphp
          minor: ${{ matrix.version }}

  # 失敗の通知は run を起動した actor にしか届かず、Renovate の自動マージやマージキュー経由の run では人に届く保証が無い。
  # main の run（dispatch を含む）の失敗を Issue に残し、直ったら閉じる。push・復旧と夜のジョブ（版ごと）で Issue を分ける
  # （scripts/failure-issue.mjs）。
  failure-issue:
    name: Failure issue
    needs: [plan, wait, bump, watch-bump, redispatch, php-prepare, php-build, php-test, php-publish, frankenphp-plan, frankenphp-build, frankenphp-push, frankenphp-test, frankenphp-publish]
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # 同時に走ると同じ Issue が二重にできるので直列にする。
    concurrency:
      group: ${{ github.workflow }}-failure-issue
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read # checkout に必要
      issues: write # Issue の作成・コメント・クローズに必要
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Open, update or close the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          PHP_VERSION_INPUT: ${{ inputs.php-version }}
          RESULTS: ${{ toJSON(needs) }}
        run: node scripts/failure-issue.mjs
