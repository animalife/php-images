# aqua - Declarative CLI Version Manager
# https://aquaproj.github.io/
# CI（ci.yml）でしか使わないツール。build.yml のビルド入力から外すため、.github/aqua.yaml と分けている。
# 版を変えたら `node scripts/regenerate-aqua-checksums.mjs` で aqua-checksums.json を消して作り直す
# （require_checksum のため、checksum が無い版は CI で入らない）。
checksum:
  enabled: true
  require_checksum: true
  supported_envs:
    - all
registries:
  - type: standard
    ref: v4.593.0 # renovate: depName=aquaproj/aqua-registry
packages:
  - name: jdx/jactionlint@v2.6.0
  - name: zizmorcore/zizmor@v1.33.1
