name: publish-image
description: >-
  検査済みのアーキごとの digest から index を作り、attestation を付けてから本タグを付ける。
  呼び出し側でリポジトリの checkout・Node のセットアップ・GHCR へのログインを済ませておくこと。
  権限は packages: write / id-token: write / attestations: write / artifact-metadata: write が要る。

inputs:
  image:
    description: タグなしのイメージ名（例 ghcr.io/animalife/php-images/php）
    required: true
  digests-dir:
    description: 検査済みの digest を 1 ファイル 1 行で置いたディレクトリ
    required: true
  expected-count:
    description: digest の数（プラットフォーム数）
    required: true
  staging-tag:
    description: index を attestation 前に置くタグ
    required: true
  kind:
    description: php / frankenphp
    required: true
  minor:
    description: PHP の minor（versions.json の php のキー）
    required: true

outputs:
  digest:
    description: 公開した index の digest
    value: ${{ steps.index.outputs.digest }}
  decision:
    description: タグの判定（move / skip）
    value: ${{ steps.tags.outputs.decision }}
  php-version:
    description: 公開した index の PHP の版
    value: ${{ steps.tags.outputs.phpVersion }}

runs:
  using: composite
  steps:
    - name: Create index under the staging tag
      id: index
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        DIGESTS_DIR: ${{ inputs.digests-dir }}
        EXPECTED: ${{ inputs.expected-count }}
        STAGING_TAG: ${{ inputs.staging-tag }}
      run: |
        set -euo pipefail
        mapfile -t digests < <(cat "${DIGESTS_DIR}"/*)
        if [ "${#digests[@]}" -ne "${EXPECTED}" ]; then
          echo "::error::検査済みの digest が ${EXPECTED} 個ではない（${#digests[@]} 個）"
          exit 1
        fi
        sources=()
        for d in "${digests[@]}"; do
          if ! [[ "${d}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::digest が不正: '${d}'"
            exit 1
          fi
          sources+=("${IMAGE}@${d}")
        done
        docker buildx imagetools create --metadata-file "${RUNNER_TEMP}/index.json" \
          -t "${IMAGE}:${STAGING_TAG}" "${sources[@]}"
        digest="$(jq -r '."containerimage.descriptor".digest' "${RUNNER_TEMP}/index.json")"
        if ! [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
          echo "::error::index の digest を読めない: '${digest}'"
          exit 1
        fi
        echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

    - name: Attest build provenance
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-name: ${{ inputs.image }}
        subject-digest: ${{ steps.index.outputs.digest }}
        push-to-registry: true

    # pin の古さは、この run の versions.json（checkout したもの）と main の先端のものを比べて決める。
    - name: Fetch versions.json on main
      shell: bash
      run: |
        set -euo pipefail
        git fetch --depth 1 origin main
        git show FETCH_HEAD:versions.json > "${RUNNER_TEMP}/main-versions.json"

    - name: Decide tags
      id: tags
      shell: bash
      env:
        KIND: ${{ inputs.kind }}
        IMAGE: ${{ inputs.image }}
        INDEX_DIGEST: ${{ steps.index.outputs.digest }}
        MINOR: ${{ inputs.minor }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
        RUN_VERSIONS_FILE: versions.json
        MAIN_VERSIONS_FILE: ${{ runner.temp }}/main-versions.json
      run: node scripts/publish-tags.mjs

    - name: Tag
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        INDEX_DIGEST: ${{ steps.index.outputs.digest }}
        DECISION: ${{ steps.tags.outputs.decision }}
        TAGS: ${{ steps.tags.outputs.tags }}
      run: |
        set -euo pipefail
        mapfile -t refs < <(jq -r '.[]' <<< "${TAGS}")
        args=()
        for r in "${refs[@]}"; do args+=(-t "${r}"); done
        if [ "${#args[@]}" -gt 0 ]; then
          docker buildx imagetools create "${args[@]}" "${IMAGE}@${INDEX_DIGEST}"
        elif [ "${DECISION}" != "skip" ]; then
          echo "::error::判定は ${DECISION} なのに付けるタグが無い"
          exit 1
        fi
        {
          echo "### ${IMAGE}"
          echo ""
          echo "- digest: \`${INDEX_DIGEST}\`（判定: ${DECISION}）"
          for r in "${refs[@]}"; do echo "- \`${r}\`"; done
        } >> "${GITHUB_STEP_SUMMARY}"
