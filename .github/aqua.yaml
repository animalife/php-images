# aqua - Declarative CLI Version Manager
# https://aquaproj.github.io/
# build.yml が使うツール（ビルドの入力）。CI でしか使わないものは .github/aqua-ci/aqua.yaml に置く。
# 版を変えたら `AQUA_CONFIG=.github/aqua.yaml aqua update-checksum --prune` で aqua-checksums.json を作り直す
# （-a はグローバル設定のパッケージまで書き込むので付けない）
# （require_checksum のため、checksum が無い版は CI で入らない）。
checksum:
  enabled: true
  require_checksum: true
  supported_envs:
    - all
registries:
  - type: standard
    ref: v4.591.0 # renovate: depName=aquaproj/aqua-registry
packages:
  - name: GoogleContainerTools/container-structure-test@v1.22.1
